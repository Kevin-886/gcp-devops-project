apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcp-devops-gke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gcp
  template:
    metadata:
      labels:
        app: gcp
    spec:
      containers:
      - name: gcp-devops-gke
        image: gcr.io/project-8566d5f4-8343-4cb1-992/gcpdevops
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"